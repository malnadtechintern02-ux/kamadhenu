<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#F5EBE0"/>
    </linearGradient>
    <radialGradient id="flameGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="40%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#D84315"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Decorative Plate -->
  <ellipse cx="400" cy="420" rx="320" ry="120" fill="#D7CCC8" stroke="#8D6E63" stroke-width="4"/>
  <ellipse cx="400" cy="420" rx="290" ry="105" fill="#EFEBE9"/>

  <!-- Cow Dung Diyas Array -->
  <!-- Diya 1 (Center Front) -->
  <g transform="translate(400, 420)">
    <ellipse cx="0" cy="20" rx="65" ry="25" fill="#4E342E"/>
    <path d="M -65 20 Q 0 -15 65 20 Q 0 45 -65 20 Z" fill="#6D4C41" stroke="#3E2723" stroke-width="3"/>
    <ellipse cx="0" cy="15" rx="45" ry="15" fill="#3E2723"/>
    <ellipse cx="0" cy="14" rx="40" ry="12" fill="#E65100" opacity="0.8"/>
    <!-- Flame -->
    <path d="M 0 10 Q -12 -15 0 -45 Q 12 -15 0 10 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  </g>

  <!-- Diya 2 (Left) -->
  <g transform="translate(260, 390)">
    <path d="M -50 15 Q 0 -10 50 15 Q 0 35 -50 15 Z" fill="#6D4C41" stroke="#3E2723" stroke-width="3"/>
    <ellipse cx="0" cy="10" rx="35" ry="10" fill="#3E2723"/>
    <path d="M 0 6 Q -9 -15 0 -38 Q 9 -15 0 6 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  </g>

  <!-- Diya 3 (Right) -->
  <g transform="translate(540, 390)">
    <path d="M -50 15 Q 0 -10 50 15 Q 0 35 -50 15 Z" fill="#6D4C41" stroke="#3E2723" stroke-width="3"/>
    <ellipse cx="0" cy="10" rx="35" ry="10" fill="#3E2723"/>
    <path d="M 0 6 Q -9 -15 0 -38 Q 9 -15 0 6 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  </g>

  <!-- Marigold Petals around -->
  <circle cx="200" cy="440" r="12" fill="#FF9800"/>
  <circle cx="220" cy="450" r="10" fill="#FFC107"/>
  <circle cx="580" cy="440" r="12" fill="#FF9800"/>
  <circle cx="600" cy="430" r="10" fill="#FFC107"/>

  <!-- Badge Banner -->
  <rect x="230" y="60" width="340" height="60" rx="30" fill="#2E7D32" />
  <text x="400" y="98" font-family="'Inter', sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">COW DUNG DIYAS (SET OF 12)</text>

  <!-- Subtitle Badge -->
  <rect x="280" y="130" width="240" height="32" rx="16" fill="#C8A951"/>
  <text x="400" y="151" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#3E2723" text-anchor="middle">100% Eco-Friendly &amp; Organic</text>
</svg>
