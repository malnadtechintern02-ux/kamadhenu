<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#EFEBE9"/>
    </linearGradient>
    <filter id="smokeBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad2)"/>

  <!-- Brass Plate Base -->
  <ellipse cx="400" cy="430" rx="300" ry="100" fill="#C8A951" stroke="#997B28" stroke-width="4"/>
  <ellipse cx="400" cy="430" rx="280" ry="88" fill="#D4AF37"/>

  <!-- Fragrant Smoke Effect -->
  <g filter="url(#smokeBlur)" opacity="0.6">
    <path d="M 400 320 Q 360 220 420 140 Q 380 80 400 30" fill="none" stroke="#FFFFFF" stroke-width="35"/>
    <path d="M 380 340 Q 430 240 370 160 Q 420 90 390 40" fill="none" stroke="#F5F5F5" stroke-width="25"/>
  </g>

  <!-- Sambrani Cup 1 (Center) -->
  <g transform="translate(400, 360)">
    <!-- Cup Body -->
    <path d="M -45 0 L -30 60 L 30 60 L 45 0 Z" fill="#4E342E" stroke="#3E2723" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="45" ry="14" fill="#6D4C41"/>
    <!-- Burning Resin inside -->
    <ellipse cx="0" cy="0" rx="36" ry="10" fill="#3E2723"/>
    <ellipse cx="0" cy="-2" rx="20" ry="6" fill="#FF6D00" opacity="0.8"/>
  </g>

  <!-- Sambrani Cup 2 (Left) -->
  <g transform="translate(270, 380)">
    <path d="M -38 0 L -25 50 L 25 50 L 38 0 Z" fill="#4E342E" stroke="#3E2723" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="38" ry="12" fill="#6D4C41"/>
  </g>

  <!-- Sambrani Cup 3 (Right) -->
  <g transform="translate(530, 380)">
    <path d="M -38 0 L -25 50 L 25 50 L 38 0 Z" fill="#4E342E" stroke="#3E2723" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="38" ry="12" fill="#6D4C41"/>
  </g>

  <!-- Header Banner -->
  <rect x="200" y="60" width="400" height="60" rx="30" fill="#1B5E20" />
  <text x="400" y="98" font-family="'Inter', sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF" text-anchor="middle">COW DUNG SAMBRANI CUPS (PACK OF 20)</text>

  <!-- Subtitle -->
  <rect x="260" y="130" width="280" height="32" rx="16" fill="#C8A951"/>
  <text x="400" y="151" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#3E2723" text-anchor="middle">Natural Frankincense &amp; Herbs</text>
</svg>
