<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F8E9"/>
      <stop offset="100%" stop-color="#DCEDC8"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#A1887F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad3)"/>

  <!-- Compost Sack / Bag -->
  <g transform="translate(400, 340)">
    <!-- Main Bag Body -->
    <path d="M -140 -100 C -150 100 -120 180 0 190 C 120 180 150 100 140 -100 Z" fill="url(#bagGrad)" stroke="#5D4037" stroke-width="6"/>
    <!-- Folded Top -->
    <ellipse cx="0" cy="-100" rx="140" ry="25" fill="#8D6E63" stroke="#5D4037" stroke-width="4"/>
    <!-- Open Top Heap of Soil -->
    <ellipse cx="0" cy="-105" rx="130" ry="30" fill="#3E2723"/>

    <!-- Plant Sprouts Growing out -->
    <path d="M -40 -110 Q -60 -160 0 -190 Q 20 -150 -40 -110 Z" fill="#4CAF50"/>
    <path d="M 40 -110 Q 60 -160 0 -190 Q -20 -150 40 -110 Z" fill="#388E3C"/>
    <path d="M 0 -110 Q -20 -180 30 -210 Q 40 -160 0 -110 Z" fill="#81C784"/>

    <!-- Bag Label -->
    <rect x="-90" y="-30" width="180" height="120" rx="12" fill="#FFFFFF" stroke="#2E7D32" stroke-width="3"/>
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="bold" font-size="16" fill="#2E7D32" text-anchor="middle">ORGANIC COMPOST</text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#5D4037" text-anchor="middle">100% Desi Cow Manure</text>
    <rect x="-50" y="45" width="100" height="24" rx="12" fill="#C8A951"/>
    <text x="0" y="61" font-family="'Inter', sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle">NET WT. 5 KG</text>
  </g>

  <!-- Header Banner -->
  <rect x="180" y="50" width="440" height="60" rx="30" fill="#2E7D32" />
  <text x="400" y="88" font-family="'Inter', sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF" text-anchor="middle">ORGANIC COW DUNG COMPOST (5KG)</text>
</svg>
